<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสผ่านใหม่ — SCHOOL OF NURSING RANGSIT UNIVERSITY</title>
<link rel="icon" type="image/jpg" href="https://raw.githubusercontent.com/airsrevice-collab/Antos/main/nav-logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="responsive.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}
.bg-shape-tr{position:fixed;top:0;right:0;width:340px;height:420px;background:linear-gradient(200deg,#FFB3C6 0%,#E8005A 40%,#FF4D8D 70%,#FFD6E0 100%);border-radius:0 0 0 60%;opacity:.85;z-index:0}
.bg-shape-bl{position:fixed;bottom:0;left:0;width:280px;height:220px;background:linear-gradient(60deg,#00AEEF 0%,#0090CC 60%,#B8E8FA 100%);border-radius:0 60% 0 0;opacity:.7;z-index:0}
.bg-sq1{position:fixed;left:60px;top:120px;width:68px;height:68px;background:#FFE8F0;border-radius:18px;transform:rotate(15deg);z-index:0}
.bg-sq2{position:fixed;left:30px;top:340px;width:90px;height:90px;background:#E0F5FF;border-radius:22px;transform:rotate(-8deg);z-index:0}
.bg-tri{position:fixed;left:290px;top:220px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid #A8926A;transform:rotate(-10deg);z-index:0}
.bg-tri2{position:fixed;right:350px;top:380px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #00AEEF;transform:rotate(30deg);z-index:0}

.logo-wrap{margin-top:48px;margin-bottom:32px;display:flex;align-items:center;gap:10px;position:relative;z-index:10;text-decoration:none}
.logo-icon{width:60px;height:60px;object-fit:contain;border-radius:0;background:transparent;border:none}
.logo-text{font-family:'Prompt',sans-serif;font-size:20px;font-weight:800;color:#B0003F;letter-spacing:-0.5px}
.logo-text span{color:#00AEEF}

.card{background:#fff;border-radius:20px;padding:40px 48px 36px;width:100%;max-width:480px;position:relative;z-index:10;box-shadow:0 4px 40px rgba(232,0,90,0.1)}
.card-title{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;text-align:center;margin-bottom:8px}
.card-sub{font-size:15px;color:#888;text-align:center;margin-bottom:32px}

.input-wrap{position:relative;margin-bottom:14px}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#ccc}
.input-wrap input{width:100%;background:#FFF5F8;border:1.5px solid #FFD6E5;border-radius:12px;padding:14px 44px;font-family:'Sarabun',sans-serif;font-size:15px;color:#333;outline:none;transition:border .2s}
.input-wrap input:focus{border-color:#E8005A;background:#FFFAFC}
.input-wrap input::placeholder{color:#bbb}
.pw-toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:#ccc;background:none;border:none;padding:0}
.pw-toggle:hover{color:#E8005A}

.btn-submit{width:100%;background:linear-gradient(135deg,#E8005A,#FF4D8D);color:#fff;border:none;padding:16px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px rgba(232,0,90,0.3);margin-bottom:20px;margin-top:8px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(232,0,90,0.4)}

.back-link{position:relative;z-index:10;margin-top:24px;display:flex;align-items:center;gap:8px;color:#E8005A;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .2s}
.back-link:hover{opacity:.75}

.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.popup-overlay.show{opacity:1;pointer-events:auto}
.popup-box{background:#fff;border-radius:24px;padding:40px 36px;text-align:center;max-width:360px;width:90%;transform:translateY(30px) scale(0.95);transition:all .3s;box-shadow:0 20px 60px rgba(232,0,90,0.2)}
.popup-overlay.show .popup-box{transform:translateY(0) scale(1)}
.popup-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:#fff}
.popup-icon.success{background:linear-gradient(135deg,#E8005A,#FF4D8D)}
.popup-icon.error{background:linear-gradient(135deg,#ef4444,#f87171)}
.popup-title{font-family:'Prompt',sans-serif;font-size:22px;font-weight:800;color:#1A1A2E;margin-bottom:8px}
.popup-sub{font-size:14px;color:#888;line-height:1.6;margin-bottom:24px}
.popup-btn{border:none;padding:14px 40px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.popup-btn.success{background:linear-gradient(135deg,#E8005A,#FF4D8D);color:#fff;box-shadow:0 6px 20px rgba(232,0,90,0.3)}
.popup-btn.error{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
.popup-btn:hover{transform:translateY(-1px)}

.email-display{background:#FFF5F8;border:1px solid #FFD6E5;border-radius:10px;padding:10px 16px;font-size:14px;color:#E8005A;font-weight:600;margin-bottom:20px;text-align:center}
</style>
</head>
<body>

<div class="bg-shape-tr"></div>
<div class="bg-shape-bl"></div>
<div class="bg-sq1"></div>
<div class="bg-sq2"></div>
<div class="bg-tri"></div>
<div class="bg-tri2"></div>

<a class="logo-wrap" href="index.html">
  <img src="logo.jpg" alt="Logo" class="logo-icon">
  <div class="logo-text">SCHOOL <span>OF NURSING RANGSIT UNIVERSITY</span></div>
</a>

<div class="card">
  <div class="card-title">ตั้งรหัสผ่านใหม่</div>
  <div class="card-sub">กรุณากรอกรหัสผ่านใหม่ของคุณ</div>

  <div class="email-display" id="emailDisplay">กำลังโหลด...</div>

  <div class="input-wrap">
    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
    <input type="password" id="pw1" placeholder="รหัสผ่านใหม่">
    <button class="pw-toggle" id="btn-pw1" onclick="togglePw('pw1','btn-pw1')">
      <i class="fa-regular fa-eye"></i>
    </button>
  </div>

  <div class="input-wrap">
    <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
    <input type="password" id="pw2" placeholder="ยืนยันรหัสผ่านใหม่">
    <button class="pw-toggle" id="btn-pw2" onclick="togglePw('pw2','btn-pw2')">
      <i class="fa-regular fa-eye"></i>
    </button>
  </div>

  <button class="btn-submit" onclick="handleReset()">บันทึกรหัสผ่านใหม่</button>
</div>

<!-- Success Popup -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-box">
    <div class="popup-icon success"><i class="fa-solid fa-check"></i></div>
    <div class="popup-title">เปลี่ยนรหัสผ่านสำเร็จ!</div>
    <div class="popup-sub">รหัสผ่านของคุณถูกเปลี่ยนแล้ว<br>กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่</div>
    <button class="popup-btn success" onclick="window.location.href='Login.html'">เข้าสู่ระบบ →</button>
  </div>
</div>

<!-- Error Popup -->
<div class="popup-overlay" id="errorPopup">
  <div class="popup-box">
    <div class="popup-icon error"><i class="fa-solid fa-xmark"></i></div>
    <div class="popup-title" id="errorTitle">เกิดข้อผิดพลาด</div>
    <div class="popup-sub" id="errorMsg">กรุณาลองใหม่อีกครั้ง</div>
    <button class="popup-btn error" onclick="document.getElementById('errorPopup').classList.remove('show')">ลองใหม่</button>
  </div>
</div>

<a href="index.html" class="back-link">← กลับหน้าแรก</a>

<script>
// ดึง email จาก URL parameter
const params = new URLSearchParams(window.location.search);
const email = params.get('email');

if (!email) {
  window.location.href = 'Forgot_password.html';
} else {
  document.getElementById('emailDisplay').textContent = '📧 ' + email;
}

function togglePw(id, btnId) {
  const input = document.getElementById(id);
  const icon = document.getElementById(btnId).querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye';
  }
}

function showError(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorPopup').classList.add('show');
}

async function handleReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.querySelector('.btn-submit');

  if (!pw1 || !pw2) {
    showError('กรุณากรอกข้อมูล', 'กรุณากรอกรหัสผ่านให้ครบ');
    return;
  }
  if (pw1 !== pw2) {
    showError('รหัสผ่านไม่ตรงกัน', 'กรุณากรอกรหัสผ่านให้ตรงกันทั้งสองช่อง');
    return;
  }
  if (pw1.length < 6) {
    showError('รหัสผ่านสั้นเกินไป', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    const res = await fetch(
      'https://script.google.com/macros/s/AKfycby8haS2rTohsB-7x0skXsfUAOnBXx7S7O7q6KSEN70Z6Hy5OtN3HvPFFlVfUAPGVq3tRg/exec?action=resetPassword' +
      '&email=' + encodeURIComponent(email) +
      '&password=' + encodeURIComponent(pw1)
    );

    const result = await res.json();

    if (result.status === 'success') {
      document.getElementById('successPopup').classList.add('show');
    } else {
      showError('ไม่พบบัญชีนี้', 'อีเมลนี้ไม่มีในระบบ กรุณาตรวจสอบอีกครั้ง');
      btn.disabled = false;
      btn.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  } catch (err) {
    showError('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
    btn.disabled = false;
    btn.textContent = 'บันทึกรหัสผ่านใหม่';
  }
}
</script>
</body>
</html>
