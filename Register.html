<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — SCHOOL OF NURSING RANGSIT UNIVERSITY</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative;padding-bottom:48px}
.bg-shape-tr{position:fixed;top:0;right:0;width:340px;height:420px;background:linear-gradient(200deg,#FFB3C6 0%,#FF6B9D 40%,#FF8FA3 70%,#FFD6E0 100%);border-radius:0 0 0 60%;opacity:.85;z-index:0}
.bg-shape-bl{position:fixed;bottom:0;left:0;width:280px;height:220px;background:linear-gradient(60deg,#C4B5FD 0%,#A78BFA 60%,#DDD6FE 100%);border-radius:0 60% 0 0;opacity:.7;z-index:0}
.bg-sq1{position:fixed;left:60px;top:120px;width:68px;height:68px;background:#F0EDFF;border-radius:18px;transform:rotate(15deg);z-index:0}
.bg-sq2{position:fixed;left:30px;top:340px;width:90px;height:90px;background:#E8E5FF;border-radius:22px;transform:rotate(-8deg);z-index:0}
.bg-sq3{position:fixed;left:200px;bottom:80px;width:50px;height:50px;background:#EDE9FE;border-radius:14px;transform:rotate(20deg);z-index:0}
.bg-tri{position:fixed;left:290px;top:220px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid #F5C842;transform:rotate(-10deg);z-index:0}
.bg-tri2{position:fixed;right:350px;top:50%;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #FF6B9D;transform:rotate(30deg);z-index:0}

.logo-wrap{margin-top:40px;margin-bottom:24px;display:flex;align-items:center;gap:10px;position:relative;z-index:10;text-decoration:none}
.logo-icon{width:60px;height:60px;object-fit:contain;border-radius:8px}
.logo-text{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#2D1B69;letter-spacing:-0.5px}
.logo-text span{color:#7C3AED}

.card{background:#fff;border-radius:20px;padding:36px 48px 32px;width:100%;max-width:480px;position:relative;z-index:10;box-shadow:0 4px 40px rgba(124,58,237,0.08)}
.card-title{font-family:'Prompt',sans-serif;font-size:24px;font-weight:800;color:#1A1A2E;text-align:center;margin-bottom:6px}
.card-sub{font-size:14px;color:#888;text-align:center;margin-bottom:4px}
.card-promo{font-size:13px;color:#7C3AED;font-weight:600;text-align:center;margin-bottom:28px;line-height:1.5}

.input-wrap{position:relative;margin-bottom:12px}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:#ccc}
.input-wrap input{width:100%;background:#F6F5FF;border:1.5px solid #EEEBFF;border-radius:12px;padding:13px 42px 13px 42px;font-family:'Sarabun',sans-serif;font-size:15px;color:#333;outline:none;transition:border .2s}
.input-wrap input:focus{border-color:#7C3AED;background:#FDFCFF}
.input-wrap input::placeholder{color:#bbb}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:15px;color:#ccc;background:none;border:none;padding:0}
.pw-toggle:hover{color:#7C3AED}

.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row-2 .input-wrap{margin-bottom:0}

.pw-hint{font-size:12px;color:#aaa;margin:-6px 0 12px 4px}

.terms-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px}
.terms-row input[type=checkbox]{width:18px;height:18px;accent-color:#7C3AED;margin-top:2px;flex-shrink:0;cursor:pointer}
.terms-row label{font-size:13px;color:#666;line-height:1.5}
.terms-row label a{color:#7C3AED;font-weight:600;text-decoration:none}
.terms-row label a:hover{text-decoration:underline}

.btn-submit{width:100%;background:linear-gradient(135deg,#7C3AED,#9B59D0);color:#fff;border:none;padding:15px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px rgba(124,58,237,0.3);margin-bottom:18px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(124,58,237,0.4)}

.card-footer{text-align:center;font-size:14px;color:#888}
.card-footer a{color:#7C3AED;font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}

.back-link{position:relative;z-index:10;margin-top:24px;display:flex;align-items:center;gap:8px;color:#7C3AED;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .2s}
.back-link:hover{opacity:.75}
</style>
</head>
<body>

<div class="bg-shape-tr"></div>
<div class="bg-shape-bl"></div>
<div class="bg-sq1"></div>
<div class="bg-sq2"></div>
<div class="bg-sq3"></div>
<div class="bg-tri"></div>
<div class="bg-tri2"></div>

<a class="logo-wrap" href="index.html">
  <img 
    src="logo.jpg" 
    alt="Logo"
    class="logo-icon"
  >
  <div class="logo-text">SCHOOL<span>OF NURSING RANGSIT UNIVERSITY</span></div>
</a>

<div class="card">
  <div class="card-title">เข้าสู่บัญชี</div>
  <div class="card-sub">สมัครสมาชิกกับเราวันนี้</div>
  <div class="card-promo">เพื่อรับส่วนลดสุดพิเศษต่างๆ มากมาย ตั้งแต่คอร์สแรก</div>

 <div class="input-wrap">
  <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
  <input type="email" placeholder="อีเมล">
</div>

<div class="row-2">
  <div class="input-wrap">
    <span class="input-icon"><i class="fa-regular fa-user"></i></span>
    <input type="text" placeholder="ชื่อ">
  </div>
  <div class="input-wrap">
    <span class="input-icon"><i class="fa-regular fa-user"></i></span>
    <input type="text" placeholder="นามสกุล">
  </div>
</div>

<div class="input-wrap">
  <span class="input-icon"><i class="fa-solid fa-phone"></i></span>
  <input type="tel" placeholder="เบอร์โทรศัพท์">
</div>

<div class="input-wrap">
  <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
  <input type="password" id="pw1" placeholder="รหัสผ่าน">
  <button class="pw-toggle" id="btn-pw1" onclick="togglePw('pw1','btn-pw1')">
    <i class="fa-regular fa-eye"></i>
  </button>
</div>

<div class="input-wrap">
  <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
  <input type="password" id="pw2" placeholder="ยืนยันรหัสผ่าน">
  <button class="pw-toggle" id="btn-pw2" onclick="togglePw('pw2','btn-pw2')">
    <i class="fa-regular fa-eye"></i>
  </button>
</div>

  <div class="terms-row">
    <input type="checkbox" id="terms">
    <label for="terms">การสมัครใช้งาน เราถือว่าคุณยอมรับ<a href="#">ข้อกำหนดการใช้งาน</a> ของ SCHOOL OF NURSING RANGSIT UNIVERSITY แล้ว</label>
  </div>

  <button class="btn-submit">สมัครสมาชิก</button>

  <div class="card-footer">
    มีบัญชีแล้ว ? &nbsp;<a href="Login.html">เข้าสู่ระบบ</a>
  </div>
</div>

<a href="index.html" class="back-link">← กลับหน้าแรก</a>

<script>
function togglePw(id, btnId) {
  const input = document.getElementById(id);
  const icon = document.getElementById(btnId).querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye';
  }
}

document.querySelector('.btn-submit').addEventListener('click', async () => {
  const data = {
    email:     document.querySelector('input[type=email]').value,
    firstName: document.querySelectorAll('input[type=text]')[0].value,
    lastName:  document.querySelectorAll('input[type=text]')[1].value,
    phone:     document.querySelector('input[type=tel]').value
  };

  const res = await fetch('YOUR_APPS_SCRIPT_URL', {
    method: 'POST',
    body: JSON.stringify(data)
  });

  const result = await res.json();
  if (result.status === 'success') {
    alert('สมัครสมาชิกสำเร็จ!');
    window.location.href = 'Login.html';
  }
});
</script>
</body>
</html>
