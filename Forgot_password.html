<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลืมรหัสผ่าน — SCHOOL OF NURSING RANGSIT UNIVERSITY</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}

/* BG SHAPES — สีจาก logo */
.bg-shape-tr{position:fixed;top:0;right:0;width:340px;height:420px;background:linear-gradient(200deg,#FFB3C6 0%,#E8005A 40%,#FF4D8D 70%,#FFD6E0 100%);border-radius:0 0 0 60%;opacity:.85;z-index:0}
.bg-shape-bl{position:fixed;bottom:0;left:0;width:280px;height:220px;background:linear-gradient(60deg,#00AEEF 0%,#0090CC 60%,#B8E8FA 100%);border-radius:0 60% 0 0;opacity:.7;z-index:0}
.bg-sq1{position:fixed;left:60px;top:120px;width:68px;height:68px;background:#FFE8F0;border-radius:18px;transform:rotate(15deg);z-index:0}
.bg-sq2{position:fixed;left:30px;top:340px;width:90px;height:90px;background:#E0F5FF;border-radius:22px;transform:rotate(-8deg);z-index:0}
.bg-sq3{position:fixed;left:200px;bottom:60px;width:50px;height:50px;background:#FFF0F5;border-radius:14px;transform:rotate(20deg);z-index:0}
.bg-tri{position:fixed;left:290px;top:220px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid #A8926A;transform:rotate(-10deg);z-index:0}
.bg-tri2{position:fixed;right:350px;top:380px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #00AEEF;transform:rotate(30deg);z-index:0}

.logo-wrap{margin-top:48px;margin-bottom:32px;display:flex;align-items:center;gap:10px;position:relative;z-index:10;text-decoration:none}
.logo-icon{width:60px;height:60px;object-fit:contain;border-radius:0;background:transparent;border:none}
.logo-text{font-family:'Prompt',sans-serif;font-size:20px;font-weight:800;color:#B0003F;letter-spacing:-0.5px}
.logo-text span{color:#00AEEF}

.card{background:#fff;border-radius:20px;padding:40px 48px 36px;width:100%;max-width:480px;position:relative;z-index:10;box-shadow:0 4px 40px rgba(232,0,90,0.1)}
.card-title{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;text-align:center;margin-bottom:8px}
.card-sub{font-size:15px;color:#888;text-align:center;margin-bottom:32px}

.input-wrap{position:relative;margin-bottom:20px}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#ccc}
.input-wrap input{width:100%;background:#FFF5F8;border:1.5px solid #FFD6E5;border-radius:12px;padding:14px 16px 14px 44px;font-family:'Sarabun',sans-serif;font-size:15px;color:#333;outline:none;transition:border .2s}
.input-wrap input:focus{border-color:#E8005A;background:#FFFAFC}
.input-wrap input::placeholder{color:#bbb}

.btn-submit{width:100%;background:linear-gradient(135deg,#E8005A,#FF4D8D);color:#fff;border:none;padding:16px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px rgba(232,0,90,0.3);margin-bottom:20px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(232,0,90,0.4)}

.card-footer{text-align:center;font-size:14px;color:#888}
.card-footer a{color:#E8005A;font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}

.back-link{position:relative;z-index:10;margin-top:28px;display:flex;align-items:center;gap:8px;color:#E8005A;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .2s}
.back-link:hover{opacity:.75}

/* Success state */
.success-msg{display:none;text-align:center;padding:20px 0}
.success-icon{font-size:52px;margin-bottom:16px;display:flex;justify-content:center;color:#E8005A}
.success-title{font-family:'Prompt',sans-serif;font-size:20px;font-weight:700;color:#1A1A2E;margin-bottom:8px}
.success-sub{font-size:14px;color:#888;line-height:1.6}
</style>
</head>
<body>

<div class="bg-shape-tr"></div>
<div class="bg-shape-bl"></div>
<div class="bg-sq1"></div>
<div class="bg-sq2"></div>
<div class="bg-sq3"></div>
<div class="bg-tri"></div>
<div class="bg-tri2"></div>

<a class="logo-wrap" href="index.html">
 <img 
    src="logo.jpg" 
    alt="Logo"
    class="logo-icon"
  >
  <div class="logo-text">SCHOOL <span>OF NURSING RANGSIT UNIVERSITY</span></div>
</a>

<div class="card">
  <!-- FORM VIEW -->
  <div id="formView">
    <div class="card-title">ลืมรหัสผ่าน</div>
    <div class="card-sub">กรุณากรอกอีเมลของคุณ</div>

   <div class="input-wrap">
    <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
    <input type="email" id="emailInput" placeholder="อีเมล">
  </div>
    <button class="btn-submit" onclick="handleReset()">รีเซ็ตรหัสผ่าน</button>

    <div class="card-footer">
      <a href="Login.html">หรือเข้าสู่ระบบ</a>
    </div>
  </div>

  <!-- SUCCESS VIEW -->
  <div id="successView" class="success-msg">
    <div class="success-icon">
      <i class="fa-regular fa-paper-plane" style="color:#E8005A"></i>
    </div>
    <div class="success-title">ส่งอีเมลแล้ว!</div>
    <div class="success-sub">เราได้ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลของคุณแล้ว<br>กรุณาตรวจสอบกล่องขาเข้าของคุณ</div>
    <br>
    <a href="Login.html" style="color:#E8005A;font-weight:600;font-size:14px;text-decoration:none">← กลับไปเข้าสู่ระบบ</a>
  </div>
</div>

<a href="index.html" class="back-link">← กลับหน้าแรก</a>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init('hZxrAXCcItKlMdFMI');

function handleReset() {
  const email = document.getElementById('emailInput').value;
  if (!email) {
    alert('กรุณากรอกอีเมลก่อน');
    return;
  }

  const btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';

  emailjs.send('service_kowbjbb', 'template_vrnuthv', {
    to_email: email,
    reset_link: 'https://airsrevice-collab.github.io/Antos/Register.html'
  })
  .then(() => {
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  })
  .catch(() => {
    alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
    btn.disabled = false;
    btn.textContent = 'รีเซ็ตรหัสผ่าน';
  });
}
</script>
</body>
</html>
