<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — SCHOOL OF NURSING RANGSIT UNIVERSITY<</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}

/* BG SHAPES */
.bg-shape-tr{position:fixed;top:0;right:0;width:340px;height:420px;background:linear-gradient(200deg,#FFB3C6 0%,#FF6B9D 40%,#FF8FA3 70%,#FFD6E0 100%);border-radius:0 0 0 60%;opacity:.85;z-index:0}
.bg-shape-bl{position:fixed;bottom:0;left:0;width:280px;height:220px;background:linear-gradient(60deg,#C4B5FD 0%,#A78BFA 60%,#DDD6FE 100%);border-radius:0 60% 0 0;opacity:.7;z-index:0}
.bg-sq1{position:fixed;left:60px;top:120px;width:68px;height:68px;background:#F0EDFF;border-radius:18px;transform:rotate(15deg);z-index:0}
.bg-sq2{position:fixed;left:30px;top:340px;width:90px;height:90px;background:#E8E5FF;border-radius:22px;transform:rotate(-8deg);z-index:0}
.bg-sq3{position:fixed;left:200px;bottom:60px;width:50px;height:50px;background:#EDE9FE;border-radius:14px;transform:rotate(20deg);z-index:0}
.bg-tri{position:fixed;left:290px;top:220px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid #F5C842;transform:rotate(-10deg);z-index:0}
.bg-tri2{position:fixed;right:350px;top:380px;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #FF6B9D;transform:rotate(30deg);z-index:0}

/* LOGO */
.logo-wrap{margin-top:48px;margin-bottom:32px;display:flex;align-items:center;gap:10px;position:relative;z-index:10;text-decoration:none}
.logo-icon{width:60px;height:60px;object-fit:contain;border-radius:8px}
.logo-text{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#2D1B69;letter-spacing:-0.5px}
.logo-text span{color:#7C3AED}

/* CARD */
.card{background:#fff;border-radius:20px;padding:40px 48px 36px;width:100%;max-width:480px;position:relative;z-index:10;box-shadow:0 4px 40px rgba(124,58,237,0.08)}
.card-title{font-family:'Prompt',sans-serif;font-size:26px;font-weight:800;color:#1A1A2E;text-align:center;margin-bottom:8px}
.card-sub{font-size:15px;color:#888;text-align:center;margin-bottom:32px}
.card-sub span{color:#7C3AED;font-weight:600}

/* INPUTS */
.input-wrap{position:relative;margin-bottom:14px}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;color:#ccc}
.input-wrap input{width:100%;background:#F6F5FF;border:1.5px solid #EEEBFF;border-radius:12px;padding:14px 44px 14px 44px;font-family:'Sarabun',sans-serif;font-size:15px;color:#333;outline:none;transition:border .2s}
.input-wrap input:focus{border-color:#7C3AED;background:#FDFCFF}
.input-wrap input::placeholder{color:#bbb}
.pw-toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:#ccc;background:none;border:none;padding:0}
.pw-toggle:hover{color:#7C3AED}

.forgot-link{display:block;text-align:right;color:#7C3AED;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:20px;margin-top:4px}
.forgot-link:hover{text-decoration:underline}

.btn-submit{width:100%;background:linear-gradient(135deg,#7C3AED,#9B59D0);color:#fff;border:none;padding:16px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 24px rgba(124,58,237,0.3);margin-bottom:20px}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(124,58,237,0.4)}

.card-footer{text-align:center;font-size:14px;color:#888}
.card-footer a{color:#7C3AED;font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}

.back-link{position:relative;z-index:10;margin-top:28px;display:flex;align-items:center;gap:8px;color:#7C3AED;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .2s}
.back-link:hover{opacity:.75}

/* ERROR POPUP */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.popup-overlay.show{opacity:1;pointer-events:auto}
.popup-box{background:#fff;border-radius:24px;padding:40px 36px;text-align:center;max-width:360px;width:90%;transform:translateY(30px) scale(0.95);transition:all .3s;box-shadow:0 20px 60px rgba(124,58,237,0.2)}
.popup-overlay.show .popup-box{transform:translateY(0) scale(1)}
.popup-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:#fff}
.popup-icon.success{background:linear-gradient(135deg,#7C3AED,#9B59D0)}
.popup-icon.error{background:linear-gradient(135deg,#ef4444,#f87171)}
.popup-title{font-family:'Prompt',sans-serif;font-size:22px;font-weight:800;color:#1A1A2E;margin-bottom:8px}
.popup-sub{font-size:14px;color:#888;line-height:1.6;margin-bottom:24px}
.popup-btn{border:none;padding:14px 40px;border-radius:12px;font-family:'Prompt',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(124,58,237,0.3)}
.popup-btn.success{background:linear-gradient(135deg,#7C3AED,#9B59D0);color:#fff}
.popup-btn.error{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
.popup-btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>

<!-- BG -->
<div class="bg-shape-tr"></div>
<div class="bg-shape-bl"></div>
<div class="bg-sq1"></div>
<div class="bg-sq2"></div>
<div class="bg-sq3"></div>
<div class="bg-tri"></div>
<div class="bg-tri2"></div>

<!-- LOGO -->
<a class="logo-wrap" href="index.html">
  <img 
    src="logo.jpg" 
    alt="Logo"
    class="logo-icon"
  >
  <div class="logo-text">SCHOOL <span>OF NURSING RANGSIT UNIVERSITY</span></div>
</a>

<!-- CARD -->
<div class="card">
  <div class="card-title">เข้าสู่บัญชี</div>
  <div class="card-sub">เรียนรู้คอร์สเรียนกับผู้เชี่ยวชาญจากหลากหลายสาขา</div>

 <div class="input-wrap">
  <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
  <input type="email" placeholder="อีเมล">
</div>

<div class="input-wrap">
  <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
  <input type="password" id="pw" placeholder="รหัสผ่าน">
  <button class="pw-toggle" id="pw-btn" onclick="togglePw('pw','pw-btn')">
    <i class="fa-regular fa-eye"></i>
  </button>
</div>
  <a href="Forgot_password.html" class="forgot-link">ลืมรหัสผ่าน ?</a>

  <button class="btn-submit">เข้าสู่ระบบ</button>

  <div class="card-footer">
    ยังไม่เป็นสมาชิก &nbsp;<a href="Register.html">คลิกเพื่อสมัครสมาชิก</a>
  </div>
</div>

<!-- Success Popup -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-box">
    <div class="popup-icon success"><i class="fa-solid fa-check"></i></div>
    <div class="popup-title">เข้าสู่ระบบสำเร็จ!</div>
    <div class="popup-sub">ยินดีต้อนรับกลับมา<br>กำลังพาคุณไปหน้าหลัก...</div>
    <button class="popup-btn success" onclick="window.location.href='index.html'">ไปหน้าหลัก →</button>
  </div>
</div>

<!-- Error Popup -->
<div class="popup-overlay" id="errorPopup">
  <div class="popup-box">
    <div class="popup-icon error"><i class="fa-solid fa-xmark"></i></div>
    <div class="popup-title" id="errorTitle">เกิดข้อผิดพลาด</div>
    <div class="popup-sub" id="errorMsg">กรุณาลองใหม่อีกครั้ง</div>
    <button class="popup-btn error" onclick="document.getElementById('errorPopup').classList.remove('show')">ลองใหม่</button>
  </div>
</div>
<a href="index.html" class="back-link">← กลับหน้าแรก</a>

<script>
function togglePw(id, btnId) {
  const input = document.getElementById(id);
  const icon = document.getElementById(btnId).querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye';
  }
}

function showError(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent   = msg;
  document.getElementById('errorPopup').classList.add('show');
}

document.querySelector('.btn-submit').addEventListener('click', async () => {
  const btn      = document.querySelector('.btn-submit');
  const email    = document.querySelector('input[type=email]').value;
  const password = document.getElementById('pw').value;

  if (!email || !password) {
    showError('กรุณากรอกข้อมูล', 'กรุณากรอกอีเมลและรหัสผ่านให้ครบ');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';

  try {
    const res = await fetch(
      'YOUR_APPS_SCRIPT_URL?email=' + encodeURIComponent(email) +
      '&password=' + encodeURIComponent(password)
    );

    const result = await res.json();

    if (result.status === 'success') {
      document.getElementById('successPopup').classList.add('show');
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    } else {
      showError('เข้าสู่ระบบไม่สำเร็จ', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  } catch (err) {
    showError('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
});
</script>
</body>
</html>
